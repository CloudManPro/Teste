name: Cloudman Pipeline

on:
  push:
    # Gatilho apenas se o manifesto mudar
    paths: ['**/manifest.json']

permissions:
  id-token: write   # OBRIGATÓRIO para o OIDC da AWS funcionar
  contents: read    # OBRIGATÓRIO para o checkout do código

jobs:
  infrastructure:
    # Chama a Engine centralizada
    uses: CloudManPro/cloudman-core/.github/workflows/engine.yml@main
    
    # ------------------------------------------------------------------
    # AJUSTE NECESSÁRIO 1: Herança de Segredos
    # ------------------------------------------------------------------
    # Isso permite que a Engine leia secrets configurados no repo do cliente
    # (Ex: AZURE_CLIENT_SECRET, ou chaves de API específicas)
    secrets: inherit

    # ------------------------------------------------------------------
    # AJUSTE RECOMENDADO 2: Concorrência
    # ------------------------------------------------------------------
    # Se o usuário fizer 2 pushs seguidos, cancela o anterior para não
    # travar o arquivo de estado (Lock do Terraform)
    concurrency: 
      group: ${{ github.repository }}-${{ github.workflow }}
      cancel-in-progress: false # False é mais seguro para Terraform (não mata processo no meio da escrita)
