# REPOSITÓRIO DO CLIENTE: .github/workflows/lambda-sync.yml
name: "CloudMan Sync Listener"

on:
  workflow_dispatch:
    inputs:
      direction:
        required: true
      region:
        default: "us-east-1"
      role_arn:
        required: true
      resources_json:
        required: true

permissions:
  id-token: write
  contents: write

jobs:
  sync-job:
    # Chama o Engine Centralizado (Seguro e Versionado)
    uses: CloudManPro/cloudman-core/.github/workflows/lambda-sync.yml@v1
    with:
      direction: ${{ inputs.direction }}
      region: ${{ inputs.region }}
      role_arn: ${{ inputs.role_arn }}
      resources_json: ${{ inputs.resources_json }}
